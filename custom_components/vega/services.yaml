read_can_scripts:
  name: Read CAN scripts
  description: >-
    Read the tracker's Setting 5502 CAN-script slots into the integration and
    config/vega/can_scripts_<imei>.json. Also refreshes the command-button labels.

write_can_script:
  name: Write CAN script
  description: >-
    Build a CAN-script buffer from a decoded spec and write it to a tracker slot.
    Requires Direct Control to be on (writes to the vehicle).
  fields:
    slot:
      name: Slot
      description: Setting 5502 sub-id (slot index).
      required: true
      selector:
        number:
          min: 0
          max: 15
          mode: box
    script:
      name: Script
      description: >-
        {"name": "...", "repeat": 1, "frames": [{"delay_ms": 2000, "can_id": 916,
        "bus": 2, "data": "fcff0fff001ff000"}, ...]}
      required: true
      selector:
        object:

run_script:
  name: Run CAN script (slot)
  description: >-
    Trigger a factory CAN-script slot by index on the tracker (Vega binary subcmd
    0x43). Plays the frames stored in Setting 5502 slot <slot>. Requires Direct
    Control on. NB: the 0x43 run-script path is not yet validated live — test one
    slot under supervision first.
  fields:
    slot:
      name: Slot
      description: Setting 5502 sub-id (0-7) to run.
      required: true
      selector:
        number:
          min: 0
          max: 15
          mode: box
